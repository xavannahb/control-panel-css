        <fieldset>
            <legend>Rotatie</legend>
            <button id="links">&#9664;</button>
            <button id="omhoog">&#9650;</button>
            <button id="nul">0</button>
            <button id="omlaag">&#9660;</button>
            <button id="rechts">&#9654;</button>
        </fieldset>
    </aside>
    <script>
        const section = document.querySelector('section'); 

        let rotateY = 0;
        let rotateX = 0;
        let rotateZ = 0;

        function update() {
            section.style.transform = `rotateY(${rotateY}deg) rotateX(${rotateX}deg) translateZ(${rotateZ}px)`;
        }

        document.getElementById('links').addEventListener('click', () => { rotateY += 45; update(); });
        document.getElementById('rechts').addEventListener('click', () => { rotateY -= 45; update(); });
        document.getElementById('omhoog').addEventListener('click', () => { rotateZ += 45; update(); });
        document.getElementById('omlaag').addEventListener('click', () => { rotateZ -= 45; update(); });
        document.getElementById('nul').addEventListener('click', () => { rotateY = 0; rotateX = 0; rotateZ = 0;update(); });
        // Bron: Jad voorbeeld in de workshops tijdens meesterschap
    </script>
